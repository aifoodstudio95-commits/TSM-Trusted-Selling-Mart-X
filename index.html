<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TSM – Trusted Selling Mart X</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}
header{background:#111;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:5}
.logo{font-size:23px;font-weight:bold}
.logo span{color:#ff0055}
.search{margin:12px auto 0;max-width:600px;display:flex}
.search input{flex:1;padding:12px;border:0;border-radius:8px 0 0 8px}
.search button{background:#ff0055;color:white;border:0;padding:12px 18px}
.hero{background:linear-gradient(120deg,#111,#333);color:white;margin:15px auto;padding:35px 20px;max-width:1100px;border-radius:15px}
.hero h1{font-size:38px;margin:10px 0}
.hero p{color:#ddd}
.btn{background:#ff0055;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:bold}
section{max-width:1100px;margin:25px auto;padding:0 15px}
h2{margin-bottom:15px}
.categories,.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.category,.card{background:white;border-radius:12px;padding:15px;text-align:center;box-shadow:0 2px 10px #0001}
.category{cursor:pointer}
.icon{font-size:42px}
.card{padding:0;overflow:hidden;text-align:left}
.photo{height:170px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:65px}
.info{padding:13px}
.price{font-size:20px;font-weight:bold;margin:8px 0}
.old{text-decoration:line-through;color:#999;font-size:13px}
.add{width:100%;background:#111;color:white;border:0;padding:11px;border-radius:7px}
.cart{position:fixed;right:15px;bottom:15px;background:#ff0055;color:white;border:0;border-radius:50px;padding:15px 20px;font-weight:bold;z-index:10}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:flex-end}
.modal.show{display:flex}
.box{background:white;width:100%;max-width:550px;margin:auto;padding:20px;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto}
input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px}
.close{float:right;border:0;background:#eee;padding:8px;border-radius:50%}
.order{width:100%;background:#ff0055;color:white;border:0;padding:13px;border-radius:8px;font-weight:bold}
footer{background:#111;color:#ddd;text-align:center;padding:30px;margin-top:35px}
@media(max-width:700px){
.categories,.products{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:30px}
.photo{height:140px}
}
</style>
</head>

<body>

<header>
<div class="logo">TSM <span>•</span> Trusted Selling Mart X</div>
<div class="search">
<input id="search" placeholder="Search products..." oninput="showProducts()">
<button onclick="showProducts()">🔍</button>
</div>
</header>

<div class="hero">
<div>WELCOME TO TSM</div>
<h1>Shop Smart. Shop Trusted
